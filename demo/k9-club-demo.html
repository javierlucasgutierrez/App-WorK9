<title>K9 Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mismo aspecto que la app real: verde bosque + yute, fondo arena. Diseño de un solo tema (claro), deliberado. */
:root {
  color-scheme: light;
  --brand-50:#eef6f0; --brand-100:#d4eadb; --brand-200:#a9d3b7; --brand-500:#2f7d52; --brand-600:#256742; --brand-700:#1d5135; --brand-800:#163d29; --brand-900:#0f2a1c;
  --jute-50:#fbf6ec; --jute-100:#f4e6c8; --jute-200:#e9cf98; --jute-400:#d2a24c; --jute-600:#a8742a; --jute-700:#85591f;
  --sand:#f6f3ec; --white:#ffffff; --ink:#1f231f; --muted:#6b6f68; --line:#e3e0d8; --line-strong:#cfcbc1;
  --amber:#f5c13d; --amber-ink:#4a3505; --amber-50:#fdf6e3; --red:#b42318; --red-50:#fdf0ee; --dark:#262a26;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--sand); color: var(--ink); font-family: var(--font); font-size: 16px; -webkit-tap-highlight-color: transparent; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--brand-800); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
h1,h2 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); }

header.top { position: sticky; top: env(safe-area-inset-top,0px); z-index: 20; background: var(--brand-800); color: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
header.top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px; }
.brand { display:inline-flex; align-items:center; gap:8px; }
.brand b { font-size:20px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }
.brand small { border-left:1px solid rgba(210,162,76,.5); padding-left:8px; font-size:11px; line-height:1.2; color:var(--jute-200); font-weight:500; }
.brand small span { display:block; }
.topnav { display:none; gap:4px; }
.topnav button { padding:6px 12px; border-radius:999px; font-size:14px; font-weight:500; color:rgba(255,255,255,.8); }
.topnav button.on { background:rgba(255,255,255,.15); color:var(--white); }
.topnav .pub { background:var(--jute-400); color:var(--brand-900); font-weight:600; margin-left:4px; }
.topuser { display:none; }
.demo-band { background: var(--jute-100); color: var(--jute-700); font-size: 13px; }
.demo-band .wrap { padding-block:6px; display:flex; gap:8px; justify-content:space-between; align-items:center; }
.demo-band button { text-decoration: underline; font-size: 13px; font-weight:600; color: var(--jute-700); }

main { padding-block: 20px calc(96px + env(safe-area-inset-bottom,0px)); }
nav.bottom { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--white); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
nav.bottom button { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0; font-size:11px; font-weight:500; color:var(--muted); }
nav.bottom button .ic { font-size:20px; line-height:1; filter:grayscale(1); opacity:.7; }
nav.bottom button.on { color:var(--brand-700); }
nav.bottom button.on .ic { filter:none; opacity:1; }
nav.bottom button.plus { color:var(--brand-800); font-weight:600; padding-top:0; }
nav.bottom .plus .ic { filter:none; opacity:1; margin-top:-16px; width:48px; height:48px; border-radius:50%; background:var(--jute-400); color:var(--brand-900); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; box-shadow:0 0 0 4px var(--white), 0 3px 8px rgba(0,0,0,.2); }
@media (min-width: 768px) {
  .topnav, .topuser { display:flex; }
  nav.bottom { display:none; }
  main { padding-bottom: 40px; }
  .brand small span { display:inline; }
  .brand small span + span::before { content:" · "; }
}

.card { background:var(--white); border:1px solid rgba(0,0,0,.05); border-radius:16px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.h1 { font-size:24px; font-weight:700; letter-spacing:-.01em; color:var(--brand-900); }
.h2 { font-size:18px; font-weight:600; color:var(--brand-900); }
.muted { font-size:14px; color:var(--muted); }
.stack { display:flex; flex-direction:column; gap:16px; }
.row { display:flex; gap:8px; align-items:center; }
.between { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.btn, .btn2, .btn-acc, .btn-danger { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 16px; border-radius:12px; font-weight:600; transition:transform .1s; }
.btn { background:var(--brand-600); color:var(--white); }
.btn2 { background:var(--white); border:1px solid var(--line-strong); color:var(--ink); }
.btn-acc { background:var(--jute-400); color:var(--brand-900); }
.btn-danger { background:var(--white); border:1px solid #f3c7c1; color:var(--red); font-size:14px; }
.btn:active, .btn2:active, .btn-acc:active { transform:scale(.98); }
.full { width:100%; }
:focus-visible { outline: 3px solid var(--brand-200); outline-offset: 2px; }
.link { color:var(--brand-600); font-weight:500; }
.badge { display:inline-block; border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; white-space:nowrap; }
.b-new { background:var(--brand-100); color:var(--brand-700); }
.b-used { background:var(--jute-100); color:var(--jute-700); }
.b-RESERVED { background:var(--amber); color:var(--amber-ink); }
.b-SOLD { background:var(--dark); color:var(--white); }
.b-ACTIVE { background:var(--brand-600); color:var(--white); }
.chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-inline:-16px; padding:0 16px 4px; }
.chips::-webkit-scrollbar { display:none; }
.chip { white-space:nowrap; border:1px solid var(--line-strong); background:var(--white); border-radius:999px; padding:6px 12px; font-size:14px; font-weight:500; color:#3d413c; }
.chip.on { background:var(--brand-600); border-color:var(--brand-600); color:var(--white); }
label.lbl, p.lbl { display:block; margin-bottom:4px; font-size:14px; font-weight:500; color:#3d413c; }
.input { width:100%; border:1px solid var(--line-strong); border-radius:12px; background:var(--white); padding:10px 12px; font:inherit; font-size:16px; color:var(--ink); }
.input:focus { outline:none; border-color:var(--brand-500); box-shadow:0 0 0 3px var(--brand-100); }
.input:disabled { background:#f0efea; }
textarea.input { resize:vertical; }
.hint { font-size:13px; color:var(--muted); margin-top:4px; }
.seg { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.seg button { border:1px solid var(--line-strong); background:var(--white); border-radius:12px; padding:10px; font-weight:500; }
.seg button.on { border-color:var(--brand-600); background:var(--brand-50); color:var(--brand-700); }
.notice { background:var(--brand-50); color:var(--brand-700); border-radius:12px; padding:8px 12px; font-size:14px; font-weight:500; }
.error { background:var(--red-50); color:var(--red); border-radius:12px; padding:8px 12px; font-size:14px; }
.empty { border:1px dashed var(--line-strong); border-radius:16px; padding:24px; text-align:center; color:var(--muted); }

.hero { background:var(--brand-800); color:var(--white); margin:-20px -16px 0; padding:24px 16px 32px; }
.hero .eyebrow { font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--jute-200); }
.hero h1 { font-size:30px; line-height:1.15; font-weight:800; margin-top:8px; }
.hero h1 em { font-style:normal; color:var(--jute-400); }
.hero p.lead { margin-top:12px; color:rgba(255,255,255,.8); max-width:36em; line-height:1.5; }
.hero form { display:flex; gap:8px; margin-top:20px; max-width:560px; }
.hero .stats { margin-top:16px; font-size:14px; color:rgba(255,255,255,.7); }
.hero .stats b { color:var(--white); }
@media (min-width: 640px) { .hero { margin:0; border-radius:24px; padding:40px 32px; } .hero h1 { font-size:38px; } }
.cats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
@media (min-width:640px){ .cats { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (min-width:1000px){ .cats { grid-template-columns:repeat(5,minmax(0,1fr)); } }
.cat { display:flex; gap:12px; align-items:flex-start; text-align:left; padding:12px; height:100%; width:100%; }
.cat .ic { font-size:24px; line-height:1; }
.cat b { display:block; color:var(--brand-900); line-height:1.2; }
.cat small { display:block; font-size:12px; color:var(--muted); }
.cat i { display:block; font-style:normal; font-size:12px; font-weight:600; color:var(--brand-600); margin-top:2px; }

.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; list-style:none; margin:0; padding:0; }
@media (min-width:640px){ .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (min-width:1000px){ .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.lc { display:flex; flex-direction:column; height:100%; overflow:hidden; padding:0; text-align:left; width:100%; }
.lc.sold { opacity:.6; }
.lc .ph { position:relative; aspect-ratio:1; max-width:100%; background:var(--jute-50); }
.lc .ph img { width:100%; height:100%; object-fit:cover; display:block; }
.lc .ph .badge { position:absolute; left:8px; top:8px; }
.lc .bd { display:flex; flex-direction:column; gap:4px; padding:12px; flex:1; }
.price { font-weight:800; color:var(--brand-800); }
.price.free { color:var(--jute-700); }
.lc .price { font-size:18px; line-height:1.2; }
.lc .t { font-size:14px; font-weight:500; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.lc .ft { margin-top:auto; padding-top:4px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:4px; }
.lc .loc { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.gifts { background:var(--jute-50); border-radius:24px; padding:16px; }
.cta { display:flex; flex-direction:column; gap:12px; align-items:flex-start; background:var(--brand-50); border-color:var(--brand-100); padding:20px; }
@media (min-width:640px){ .cta { flex-direction:row; align-items:center; justify-content:space-between; } }

.gal { background:#111; position:relative; }
.gal .strip { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.gal .strip::-webkit-scrollbar { display:none; }
.gal .strip img { width:100%; flex-shrink:0; aspect-ratio:4/3; max-width:100%; object-fit:contain; scroll-snap-align:center; display:block; }
.gal .cnt { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.6); color:var(--white); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; }
.thumbs { display:flex; gap:8px; padding:8px; overflow-x:auto; }
.thumbs button { width:56px; height:56px; flex-shrink:0; border-radius:8px; overflow:hidden; border:2px solid transparent; opacity:.7; padding:0; }
.thumbs button.on { border-color:var(--brand-600); opacity:1; }
.thumbs img { width:100%; height:100%; object-fit:cover; display:block; }
.detail { display:grid; gap:16px; max-width:780px; margin:0 auto; }
@media (min-width:768px){ .detail { grid-template-columns:minmax(0,1fr) 320px; align-items:start; } }
.meta { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:14px; color:var(--muted); }
.desc { white-space:pre-line; line-height:1.6; color:#2c302b; }
.av { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; border-radius:50%; background:var(--jute-200); color:var(--brand-900); font-weight:700; width:40px; height:40px; }
.av.lg { width:48px; height:48px; font-size:18px; }
.av.xl { width:56px; height:56px; font-size:24px; }
.av.sm { width:28px; height:28px; font-size:14px; }
.contact .sel { user-select:all; font-size:14px; word-break:break-all; }
.contact .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.contact .acts > * { flex:1; font-size:14px; padding-inline:12px; }
.msg { background:#f4f3ef; border-radius:12px; padding:8px; font-size:14px; color:#3d413c; }
.status3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.status3 button { padding-inline:4px; font-size:14px; }
.divide > * + * { border-top:1px solid #efede7; padding-top:12px; margin-top:12px; }

.photos { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
@media (min-width:640px){ .photos { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.photos .tile { position:relative; aspect-ratio:1; max-width:100%; border-radius:12px; overflow:hidden; background:#eee; }
.photos .tile img { width:100%; height:100%; object-fit:cover; display:block; }
.photos .tile .x { position:absolute; right:4px; top:4px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.6); color:var(--white); font-size:14px; }
.photos .tile .cover { position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.6); color:var(--white); font-size:10px; font-weight:600; border-radius:999px; padding:0 6px; }
.photos .add { aspect-ratio:1; border:2px dashed var(--brand-200); background:var(--brand-50); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:14px; font-weight:600; color:var(--brand-700); cursor:pointer; text-align:center; }
.photos .add span { font-size:24px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.free-tg { display:flex; align-items:center; gap:8px; min-height:44px; border:1px solid var(--line-strong); border-radius:12px; padding:10px 12px; font-weight:500; background:var(--white); cursor:pointer; }
.free-tg.on { border-color:var(--jute-400); background:var(--jute-50); color:var(--jute-700); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end; }
.tabs { display:flex; gap:4px; background:rgba(0,0,0,.05); border-radius:12px; padding:4px; }
.tabs button { flex:1; border-radius:8px; padding:8px; font-size:14px; font-weight:600; color:var(--muted); }
.tabs button.on { background:var(--white); color:var(--brand-800); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.lrow { display:flex; gap:12px; padding:10px; text-align:left; width:100%; }
.lrow img, .lrow .noimg { width:80px; height:80px; border-radius:12px; object-fit:cover; flex-shrink:0; }
.lrow .tx { min-width:0; flex:1; display:flex; flex-direction:column; gap:2px; }
.lrow .tt { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.confirm { background:var(--red-50); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
.narrow { max-width:560px; margin:0 auto; }
.xs { max-width:440px; margin:0 auto; }
.back { display:inline-block; font-size:14px; color:var(--muted); margin-bottom:8px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + env(safe-area-inset-bottom,0px)); background:var(--brand-900); color:var(--white); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:500; z-index:40; box-shadow:0 4px 12px rgba(0,0,0,.25); max-width:calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; scroll-behavior:auto !important; } }
</style>

<header class="top">
  <div class="wrap">
    <button class="brand" data-go="home" aria-label="K9 Club, inicio">
      <svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><path d="M20 2 36 8v12c0 9.5-6.8 16.2-16 18C10.8 36.2 4 29.5 4 20V8Z" fill="#d2a24c"/><path d="M20 5.5 33 10.4V20c0 7.8-5.5 13.4-13 15-7.5-1.6-13-7.2-13-15v-9.6Z" fill="#163d29"/><text x="20" y="25.5" text-anchor="middle" font-size="14" font-weight="800" fill="#e9cf98" font-family="system-ui,sans-serif">K9</text></svg>
      <b>K9 Club</b>
      <small><span>Conecta</span><span>Aprende</span><span>Comparte</span></small>
    </button>
    <nav class="topnav" id="topnav"></nav>
    <div class="topuser" id="topuser"></div>
  </div>
</header>
<div class="demo-band"><div class="wrap"><span>Versión de demostración: lo que hagas se guarda solo en este dispositivo.</span><button data-act="reset" id="resetTop">Reiniciar</button></div></div>
<main class="wrap" id="app"></main>
<nav class="bottom" id="bottomnav"></nav>
<div class="toast" id="toast" hidden></div>

// ---------- Estado (guardado solo en este navegador) ----------
const KEY = "k9club-demo-v1";
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { db = seed(); }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast("No se ha podido guardar en este dispositivo (quizá por las fotos). Seguirá funcionando hasta que recargues."); }
}
let view = { name: "home" };
let draft = null; // formulario de anuncio en curso
let pendingDelete = false;

const me = () => db.users.find(u => u.id === db.me) || null;
const userById = id => db.users.find(u => u.id === id);
const photoUrl = p => p.startsWith("seed:") ? PHOTOS[p.slice(5)] : p;
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const money = c => new Intl.NumberFormat("es-ES", { style:"currency", currency:"EUR", minimumFractionDigits: c % 100 === 0 ? 0 : 2 }).format(c / 100);
const fmtDate = t => new Intl.DateTimeFormat("es-ES", { day:"numeric", month:"short", year:"numeric" }).format(new Date(t));
const fmtMonth = t => new Intl.DateTimeFormat("es-ES", { month:"long", year:"numeric" }).format(new Date(t));
function ago(t) { const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? "hoy" : d === 1 ? "ayer" : d < 30 ? `hace ${d} días` : fmtDate(t); }
function wa(phone) { let d = phone.replace(/\D/g, ""); if (d.startsWith("00")) d = d.slice(2); if (d.length === 9) d = "34" + d; return d.length >= 10 ? "https://wa.me/" + d : null; }
const initial = n => esc(n.trim().charAt(0).toUpperCase());

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200);
}

function go(name, params = {}) {
  view = { name, ...params };
  pendingDelete = false;
  if (name !== "publish" && name !== "edit") draft = null;
  render();
  window.scrollTo(0, 0);
}
function needLogin(back) { if (me()) return false; go("login", { back }); return true; }

// ---------- Piezas ----------
function priceHtml(l, cls = "") {
  return l.isFree ? `<span class="price free ${cls}">🎁 Lo regalo</span>` : `<span class="price ${cls}">${money(l.price)}</span>`;
}
const condBadge = c => `<span class="badge ${c === "NEW" ? "b-new" : "b-used"}">${c === "NEW" ? "Nuevo" : "Segunda mano"}</span>`;
const statusBadge = (s, showActive) => s === "ACTIVE" && !showActive ? "" : `<span class="badge b-${s}">${STATUS[s]}</span>`;

function cardHtml(l) {
  const ph = l.photos[0] ? `<img src="${photoUrl(l.photos[0])}" alt="${esc(l.title)}" loading="lazy">` : "";
  return `<li><button class="card lc ${l.status === "SOLD" ? "sold" : ""}" data-go="detail" data-id="${l.id}">
    <div class="ph">${ph}${statusBadge(l.status)}</div>
    <div class="bd">${priceHtml(l)}<p class="t">${esc(l.title)}</p>
      <div class="ft">${condBadge(l.condition)}<span class="loc">📍 ${esc(l.location)}</span></div></div>
  </button></li>`;
}
const gridHtml = ls => `<ul class="grid">${ls.map(cardHtml).join("")}</ul>`;
const visible = () => db.listings.filter(l => l.status !== "SOLD").sort((a, b) => b.createdAt - a.createdAt);

function contactHtml(p, subject) {
  const w = p.phone && wa(p.phone);
  return `<div class="contact">
    <div class="row" style="gap:12px"><span class="av">${initial(p.name)}</span>
      <div style="min-width:0"><p style="font-weight:600">${esc(p.name)}</p><p class="muted">${[ACCOUNT[p.accountType], p.location].filter(Boolean).map(esc).join(" · ")}</p></div></div>
    <p class="sel" style="margin-top:8px">✉️ ${esc(p.email)}</p>
    ${p.phone ? `<p class="sel">📞 ${esc(p.phone)}</p>` : ""}
    <div class="acts">
      ${p.phone ? `<a class="btn2" href="tel:${esc(p.phone.replace(/\s/g, ""))}">📞 Llamar</a>` : ""}
      ${w ? `<a class="btn2" href="${w}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>` : ""}
      <button class="btn2" data-act="copy" data-text="${esc(p.email)}">✉️ Copiar correo</button>
    </div></div>`;
}

function searchView() {
  const f = view;
  const words = norm(f.q).split(" ").filter(Boolean);
  const zone = norm(f.zona);
  let ls = visible().filter(l => {
    const text = norm([l.title, l.description, l.category, l.location].join(" "));
    if (!words.every(w => text.includes(w))) return false;
    if (zone && !norm(l.location).includes(zone)) return false;
    if (f.cat && l.category !== f.cat) return false;
    if (f.tipo === "segunda" && l.condition !== "USED") return false;
    if (f.tipo === "nuevo" && l.condition !== "NEW") return false;
    if (f.tipo === "gratis" && !l.isFree) return false;
    return true;
  });
  if (f.orden === "barato") ls.sort((a, b) => (a.price ?? 0) - (b.price ?? 0));
  if (f.orden === "caro") ls.sort((a, b) => (b.price ?? 0) - (a.price ?? 0));
  const zones = [...new Set([...db.listings.map(l => l.location), ...db.users.map(u => u.location).filter(Boolean)])].sort();
  const types = [["", "Todo"], ["segunda", "Segunda mano"], ["nuevo", "Nuevo"], ["gratis", "Gratis"]];
  const has = f.q || f.cat || f.tipo || f.zona;
  return `<h1 class="h1" style="margin-bottom:12px">${esc(f.cat || "Buscar material")}</h1>
    <form class="card stack" data-form="search" role="search" style="gap:8px;padding:12px;margin-bottom:12px">
      <input class="input" id="sq" name="q" type="search" value="${esc(f.q)}" placeholder="¿Qué buscas? Ej.: manga, bozal, jaula…" aria-label="Palabras">
      <div class="row"><input class="input" id="sz" name="zona" value="${esc(f.zona)}" placeholder="📍 Zona o ciudad" aria-label="Zona o ciudad" list="zonas">
        <datalist id="zonas">${zones.map(z => `<option value="${esc(z)}"></option>`).join("")}</datalist>
        <select class="input" id="so" name="orden" aria-label="Ordenar" style="width:auto">${[["", "Más recientes"], ["barato", "Más baratos"], ["caro", "Más caros"]].map(([v, t]) => `<option value="${v}" ${f.orden === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <button class="btn full">🔍 Buscar</button>
    </form>
    <div class="chips" style="margin-bottom:8px">${types.map(([v, t]) => `<button class="chip ${(f.tipo || "") === v ? "on" : ""}" data-filter="tipo" data-val="${v}">${t}</button>`).join("")}</div>
    <div class="chips" style="margin-bottom:16px"><button class="chip ${!f.cat ? "on" : ""}" data-filter="cat" data-val="">Todas las categorías</button>${CATS.map(([c]) => `<button class="chip ${f.cat === c ? "on" : ""}" data-filter="cat" data-val="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="between" style="margin-bottom:12px"><p class="muted">${ls.length === 1 ? "1 anuncio" : ls.length + " anuncios"}${f.q ? ` con «${esc(f.q)}»` : ""}${f.zona ? ` en «${esc(f.zona)}»` : ""}</p>${has ? `<button class="link" style="font-size:14px" data-go="search">Quitar filtros</button>` : ""}</div>
    ${ls.length ? gridHtml(ls) : `<div class="empty"><p style="font-size:30px">🐕‍🦺</p><p style="margin-top:8px">No hay anuncios con estos filtros.</p><p style="margin-top:4px;font-size:14px">Prueba con otra palabra o quita algún filtro.</p></div>`}`;
}

        <label class="free-tg ${d.isFree ? "on" : ""}"><input type="checkbox" id="isFree" data-act="free" ${d.isFree ? "checked" : ""} style="width:20px;height:20px;accent-color:#a8742a"> 🎁 Lo regalo</label></div>
      <div><label class="lbl" for="location">Zona o ciudad</label><input class="input" id="location" name="location" value="${esc(d.location)}" placeholder="Ej.: Sevilla" list="zonas2"><datalist id="zonas2">${zones.map(z => `<option value="${esc(z)}"></option>`).join("")}</datalist></div>
      ${d.error ? `<p class="error" role="alert">${esc(d.error)}</p>` : ""}
      <button class="btn full">${isEdit ? "Guardar cambios" : "Publicar anuncio"}</button>
    </form>
    ${isEdit ? (pendingDelete ? `<div class="confirm" style="margin-top:24px"><p style="font-weight:600;color:var(--red)">¿Seguro que quieres borrar este anuncio? No se puede deshacer.</p><div class="row"><button class="btn-danger" style="flex:1" data-act="delete">Sí, borrar</button><button class="btn2" style="flex:1" data-act="nodelete">Cancelar</button></div></div>` : `<p style="text-align:center;margin-top:24px"><button class="btn-danger" data-act="askdelete">🗑️ Borrar anuncio</button></p>`) : ""}
  </div>`;
}

function mineView() {
  const u = me();
  const tab = view.tab || "pub";
  const mine = db.listings.filter(l => l.sellerId === u.id).sort((a, b) => b.createdAt - a.createdAt);
  const ints = db.interests.filter(i => i.userId === u.id).sort((a, b) => b.createdAt - a.createdAt).map(i => ({ i, l: db.listings.find(l => l.id === i.listingId) })).filter(x => x.l);
  const row = (l, extra) => `<li><button class="card lrow" data-go="detail" data-id="${l.id}" style="${l.status === "SOLD" ? "opacity:.7" : ""}">${l.photos[0] ? `<img src="${photoUrl(l.photos[0])}" alt="">` : `<span class="noimg" style="background:var(--jute-50)"></span>`}<span class="tx"><span class="tt">${esc(l.title)}</span><span class="row">${priceHtml(l)}${statusBadge(l.status, true)}</span><span class="muted">${extra}</span></span></button></li>`;
  const list = items => `<ul class="stack" style="gap:8px;list-style:none;margin:0;padding:0">${items}</ul>`;
  return `<div class="narrow"><div class="between" style="align-items:center;margin-bottom:16px"><h1 class="h1">Mis anuncios</h1><button class="btn" data-go="publish">+ Publicar</button></div>
    ${view.notice ? `<p class="notice" style="margin-bottom:16px">${esc(view.notice)}</p>` : ""}
    <div class="tabs" style="margin-bottom:16px"><button class="${tab === "pub" ? "on" : ""}" data-go="mine" data-tab="pub">Publicados (${mine.length})</button><button class="${tab === "int" ? "on" : ""}" data-go="mine" data-tab="int">Me interesan (${ints.length})</button></div>
    ${tab === "int"
      ? (ints.length ? list(ints.map(({ i, l }) => row(l, `De ${esc(userById(l.sellerId).name)} · avisaste ${ago(i.createdAt)}`)).join("")) : `<div class="empty">Aún no has pulsado «Me interesa» en ningún anuncio. <button class="link" data-go="search">Echa un vistazo</button>.</div>`)
      : (mine.length ? list(mine.map(l => { const n = db.interests.filter(i => i.listingId === l.id).length; return row(l, n ? `<b style="color:var(--brand-700)">🙋 ${n} ${n === 1 ? "interesado" : "interesados"}</b>` : `Sin interesados todavía · ${ago(l.createdAt)}`); }).join("")) : `<div class="empty"><p>Aún no has publicado nada.</p><p style="margin-top:4px;font-size:14px">¿Tienes material que ya no usas? ¡Anímate!</p></div>`)}
  </div>`;
}

function profileView() {
  const u = me();
  return `<div class="xs stack"><div class="row" style="gap:12px"><span class="av xl">${initial(u.name)}</span><div><h1 class="h1">${esc(u.name)}</h1><p class="muted">${ACCOUNT[u.accountType]} · Socio desde ${fmtMonth(u.createdAt)}</p></div></div>
    <form class="card stack" data-form="profile"><h2 class="h2">Mis datos</h2>
      <div><p class="lbl">Soy…</p><div class="seg">${Object.entries(ACCOUNT).map(([v, t]) => `<button type="button" class="${(view.acct || u.accountType) === v ? "on" : ""}" data-act="acct" data-val="${v}">${t}</button>`).join("")}</div></div>
      <div><label class="lbl" for="pname">Nombre</label><input class="input" id="pname" name="name" value="${esc(u.name)}"></div>
      <div><label class="lbl" for="pphone">Teléfono</label><input class="input" id="pphone" name="phone" type="tel" value="${esc(u.phone)}"><p class="hint">Solo lo ven las personas con las que contactas por un anuncio.</p></div>
      <div><label class="lbl" for="ploc">Zona o ciudad</label><input class="input" id="ploc" name="location" value="${esc(u.location)}"><p class="hint">Se propone al publicar un anuncio.</p></div>
      <div><p class="lbl">Correo</p><p style="background:#f4f3ef;border-radius:12px;padding:10px 12px">${esc(u.email)}</p></div>
      ${view.notice ? `<p class="notice">${esc(view.notice)}</p>` : ""}
      <button class="btn full">Guardar</button></form>
    <button class="btn2 full" data-act="logout">Cerrar sesión</button>
    <button class="btn-danger full" data-act="reset">Reiniciar la demo (volver a los datos de ejemplo)</button></div>`;

function loginView() {
  return `<div class="xs"><div class="card" style="padding:24px"><h1 class="h1">Entrar</h1><p class="muted" style="margin-top:4px">Entra para publicar anuncios y contactar con otros socios.</p>
    <form class="stack" data-form="login" style="margin-top:20px">
      <div><label class="lbl" for="lemail">Correo electrónico</label><input class="input" id="lemail" name="email" type="email" autocomplete="email" required></div>
      <div><label class="lbl" for="lpass">Contraseña</label><input class="input" id="lpass" name="password" type="password" autocomplete="current-password" required></div>
      ${view.error ? `<p class="error" role="alert">${esc(view.error)}</p>` : ""}
      <button class="btn full">Entrar</button></form>
    <p class="muted" style="text-align:center;margin-top:20px">¿Aún no eres socio? <button class="link" data-go="register" data-back="${esc(view.back || "")}">Crea tu cuenta gratis</button></p></div>
    <div class="card" style="margin-top:16px;background:var(--jute-50)"><p style="font-weight:600;margin-bottom:8px">Socios de ejemplo (contraseña <code>demo1234</code>)</p>
      <div class="stack" style="gap:8px">${db.users.slice(0, 3).map(u => `<button class="btn2 full" style="justify-content:flex-start" data-act="quick" data-email="${esc(u.email)}"><span class="av sm">${initial(u.name)}</span> ${esc(u.name)} <span class="muted" style="margin-left:auto">${esc(u.location)}</span></button>`).join("")}</div></div></div>`;
}

function registerView() {
  return `<div class="xs"><div class="card" style="padding:24px"><h1 class="h1">Únete al club</h1><p class="muted" style="margin-top:4px">Es gratis. Con tu cuenta puedes publicar anuncios y contactar con otros socios.</p>
    <form class="stack" data-form="register" style="margin-top:20px">
      <div><p class="lbl">Soy…</p><div class="seg">${Object.entries(ACCOUNT).map(([v, t]) => `<button type="button" class="${(view.acct || "INDIVIDUAL") === v ? "on" : ""}" data-act="acct" data-val="${v}">${t}</button>`).join("")}</div></div>
      <div><label class="lbl" for="rname">Nombre y apellidos</label><input class="input" id="rname" name="name" autocomplete="name"></div>
      <div><label class="lbl" for="remail">Correo electrónico</label><input class="input" id="remail" name="email" type="email" autocomplete="email"></div>
      <div><label class="lbl" for="rphone">Teléfono (opcional)</label><input class="input" id="rphone" name="phone" type="tel" autocomplete="tel"><p class="hint">Solo lo verán las personas con las que contactes por un anuncio.</p></div>
      <div><label class="lbl" for="rloc">Zona o ciudad (opcional)</label><input class="input" id="rloc" name="location" placeholder="Ej.: Valencia"></div>
      <div><label class="lbl" for="rpass">Contraseña (mínimo 6 caracteres)</label><input class="input" id="rpass" name="password" type="password" autocomplete="new-password"></div>
      ${view.error ? `<p class="error" role="alert">${esc(view.error)}</p>` : ""}
      <button class="btn full">Crear cuenta</button></form>
    <p class="muted" style="text-align:center;margin-top:20px">¿Ya eres socio? <button class="link" data-go="login" data-back="${esc(view.back || "")}">Entra</button></p></div></div>`;
}

// ---------- Pintar ----------
function navItems() {
  const u = me();
  return [["home", "Inicio", "🏠"], ["search", "Buscar", "🔍"], ["publish", "Publicar", "＋"], ["mine", "Mis anuncios", "📋"], u ? ["profile", "Perfil", "👤"] : ["login", "Entrar", "👤"]];
}
function render() {
  const n = view.name;
  const active = { detail: "search", edit: "mine", register: "login" }[n] || n;
  const app = document.getElementById("app");
  app.innerHTML = n === "home" ? homeView() : n === "search" ? searchView() : n === "detail" ? detailView()
    : n === "publish" ? listingForm(false) : n === "edit" ? listingForm(true) : n === "mine" ? mineView()
    : n === "profile" ? profileView() : n === "register" ? registerView() : loginView();
  document.getElementById("bottomnav").innerHTML = navItems().map(([k, t, i]) => `<button data-go="${k}" class="${k === "publish" ? "plus" : ""} ${active === k ? "on" : ""}" ${active === k ? 'aria-current="page"' : ""}><span class="ic">${i}</span>${t}</button>`).join("");
  document.getElementById("topnav").innerHTML = navItems().slice(0, 4).map(([k, t]) => k === "publish" ? `<button class="pub" data-go="publish">+ Publicar</button>` : `<button data-go="${k}" class="${active === k ? "on" : ""}">${t}</button>`).join("");
  const u = me();
  document.getElementById("topuser").innerHTML = u
    ? `<button data-go="profile" class="row" style="background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;color:#fff"><span class="av sm">${initial(u.name)}</span>${esc(u.name.split(" ")[0])}</button>`
    : `<button data-go="login" style="background:var(--jute-400);color:var(--brand-900);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600">Entrar</button>`;
  const strip = document.getElementById("strip");
  if (strip) strip.addEventListener("scroll", () => {
    const i = Math.round(strip.scrollLeft / strip.clientWidth);
    const c = document.getElementById("cnt"); if (c) c.textContent = `${i + 1} / ${strip.children.length}`;
    document.querySelectorAll(".thumbs button").forEach((b, j) => b.classList.toggle("on", j === i));
  }, { passive: true });
  const pick = document.getElementById("pick");
  if (pick) pick.addEventListener("change", onPick);
}

// ---------- Fotos: se reducen antes de guardarlas ----------
function shrink(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function onPick(e) {
  readDraft();
  const files = [...e.target.files].slice(0, MAX_PHOTOS - draft.photos.length);
  const out = await Promise.all(files.map(shrink));
  const okp = out.filter(Boolean);
  if (okp.length < out.length) toast("Alguna foto no se ha podido leer. Prueba con JPG o PNG.");
  draft.photos.push(...okp);
  draft.error = null;
  render();
}

function readDraft() {
  const v = id => document.getElementById(id)?.value ?? "";
  if (!document.getElementById("title")) return;
  Object.assign(draft, { title: v("title"), category: v("category"), description: v("description"), priceText: v("price"), location: v("location") });
}
function newDraft(l) {
  const u = me();
  return l
    ? { id: l.id, photos: [...l.photos], title: l.title, category: l.category, condition: l.condition, description: l.description, isFree: l.isFree, priceText: l.price == null ? "" : String(l.price / 100).replace(".", ","), location: l.location }
    : { photos: [], title: "", category: "", condition: "USED", description: "", isFree: false, priceText: "", location: u?.location || "" };
}

// ---------- Acciones ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-act],[data-filter]");
  if (!el) return;
  const d = el.dataset;
  if (d.go) {
    e.preventDefault();
    const g = d.go;
    if (g === "search") return go("search", { cat: d.cat || "", tipo: d.tipo || "" });
    if (g === "detail") return go("detail", { id: d.id });
    if (g === "mine") { if (needLogin("mine")) return; return go("mine", { tab: d.tab }); }
    if (g === "profile") { if (needLogin("profile")) return; return go("profile"); }
    if (g === "publish") { if (needLogin("publish")) return; draft = newDraft(); return go("publish"); }
    if (g === "edit") { const l = db.listings.find(x => x.id === d.id); draft = newDraft(l); view = { name: "edit", id: d.id }; pendingDelete = false; render(); return scrollTo(0, 0); }
    if (g === "login" || g === "register") return go(g, { back: d.back || view.back || "" });
    return go(g);
  }
  if (d.filter) return go("search", { ...view, name: "search", [d.filter]: d.val });
  const a = d.act;
  if (a === "thumb") { const s = document.getElementById("strip"); s.scrollTo({ left: +d.i * s.clientWidth, behavior: "smooth" }); }
  if (a === "copy") {
    const done = () => toast("Correo copiado: " + d.text);
    try { navigator.clipboard.writeText(d.text).then(done, () => toast(d.text)); } catch { toast(d.text); }
  }
  if (a === "status") { const l = db.listings.find(x => x.id === view.id); l.status = d.val; save(); view.notice = null; render(); toast("Marcado como " + STATUS[d.val]); }
  if (a === "uninterest") { db.interests = db.interests.filter(i => !(i.listingId === view.id && i.userId === db.me)); save(); view.notice = null; render(); toast("Has quitado tu interés."); }
  if (a === "rmphoto") { readDraft(); draft.photos.splice(+d.i, 1); render(); }
  if (a === "cond") { readDraft(); draft.condition = d.val; render(); }
  if (a === "free") { readDraft(); draft.isFree = el.checked; render(); }
  if (a === "askdelete") { readDraft(); pendingDelete = true; render(); }
  if (a === "nodelete") { readDraft(); pendingDelete = false; render(); }
  if (a === "delete") {
    db.listings = db.listings.filter(l => l.id !== view.id);
    db.interests = db.interests.filter(i => i.listingId !== view.id);
    save(); go("mine", { notice: "Anuncio borrado." });
  }
  if (a === "acct") { view.acct = d.val; document.querySelectorAll('[data-act="acct"]').forEach(b => b.classList.toggle("on", b === el)); }
  if (a === "logout") { db.me = null; save(); go("home"); toast("Has cerrado sesión."); }
  if (a === "quick") { document.getElementById("lemail").value = d.email; document.getElementById("lpass").value = "demo1234"; }
  if (a === "reset") {
    if (el.dataset.sure) { try { localStorage.removeItem(KEY); } catch {} db = seed(); go("home"); toast("Demo reiniciada con los datos de ejemplo."); }
    else { el.dataset.sure = "1"; el.textContent = "¿Seguro? Pulsa otra vez para reiniciar"; setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = el.id === "resetTop" ? "Reiniciar" : "Reiniciar la demo (volver a los datos de ejemplo)"; } }, 4000); }
  }
});

function afterLogin() {
  const b = view.back;
  if (b === "publish") { draft = newDraft(); return go("publish"); }
  if (b === "mine" || b === "profile") return go(b);
  if (b) return go("detail", { id: b });
  go("home");
}

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  const val = n => (f.elements[n]?.value || "").trim();
  if (kind === "herosearch") return go("search", { q: val("q") });
  if (kind === "search") return go("search", { ...view, q: val("q"), zona: val("zona"), orden: val("orden") });
  if (kind === "login") {
    const u = db.users.find(x => x.email === val("email").toLowerCase());
    if (!u || u.password !== f.elements.password.value) { view.error = "Correo o contraseña incorrectos."; return render(); }
    db.me = u.id; save(); toast("¡Hola, " + u.name.split(" ")[0] + "!"); return afterLogin();
  }
  if (kind === "register") {
    const name = val("name"), email = val("email").toLowerCase(), pw = f.elements.password.value;
    const err = !name || !email ? "Escribe tu nombre y tu correo." : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "El correo no parece válido."
      : pw.length < 6 ? "La contraseña debe tener al menos 6 caracteres." : db.users.some(u => u.email === email) ? "Ya existe una cuenta con ese correo." : null;
    if (err) { view.error = err; render(); return; }
    const u = { id: uid(), name, email, phone: val("phone") || null, location: val("location") || null, accountType: view.acct || "INDIVIDUAL", password: pw, createdAt: Date.now() };
    db.users.push(u); db.me = u.id; save(); toast("¡Bienvenido/a al club, " + name.split(" ")[0] + "!"); return afterLogin();
  }
  if (kind === "interest") {
    const msg = val("message");
    db.interests.push({ id: uid(), listingId: view.id, userId: db.me, message: msg, createdAt: Date.now() });
    save(); view.notice = "¡Aviso enviado! El anunciante ya puede ver tus datos de contacto."; return render();
  }
  if (kind === "profile") {
    const u = me(), name = val("name");
    if (!name) return toast("Escribe tu nombre.");
    Object.assign(u, { name, phone: val("phone") || null, location: val("location") || null, accountType: view.acct || u.accountType });
    save(); view.notice = "Perfil guardado."; return render();
  }
  if (kind === "listing") {
    readDraft();
    const d = draft, price = Number(d.priceText.replace(",", "."));
    d.error = !d.photos.length ? "Añade al menos una foto." : !d.title || !d.description ? "Escribe un título y una descripción."
      : !d.category ? "Elige una categoría." : !d.isFree && (!d.priceText || !Number.isFinite(price) || price < 0) ? "Pon un precio o marca «Lo regalo»."
      : !d.location ? "Indica la zona o ciudad." : null;
    if (d.error) return render();
    const data = { title: d.title, description: d.description, category: d.category, condition: d.condition, isFree: d.isFree, price: d.isFree ? null : Math.round(price * 100), location: d.location, photos: d.photos };
    if (view.name === "edit") { Object.assign(db.listings.find(l => l.id === d.id), data); save(); return go("detail", { id: d.id, notice: "✅ Cambios guardados." }); }
    const l = { id: uid(), sellerId: db.me, status: "ACTIVE", createdAt: Date.now(), ...data };
    db.listings.push(l); save(); return go("detail", { id: l.id, notice: "✅ ¡Anuncio publicado! Ya lo puede ver todo el club." });
  }
});

render();
</script>
